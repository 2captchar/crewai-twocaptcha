[project]
name = "crewai-twocaptcha"
version = "0.1.0"
description = "CrewAI tool for solving captchas via the 2Captcha service (reCAPTCHA v2/v3, Cloudflare Turnstile, image, GeeTest)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "2captcha_com", email = "2captcha.com@gmail.com" },
]
requires-python = ">=3.10,<3.14"
keywords = ["crewai", "crewai-tools", "captcha", "2captcha", "recaptcha", "turnstile", "geetest"]
dependencies = [
    "crewai>=0.100",
    "requests>=2.32,<3",
    "pydantic>=2",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/2captchar/crewai-twocaptcha"
Repository = "https://github.com/2captchar/crewai-twocaptcha"
Issues = "https://github.com/2captchar/crewai-twocaptcha/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_twocaptcha"]

[tool.hatch.build.targets.sdist]
include = [
    "src/crewai_twocaptcha",
    "README.md",
    "README.ru.md",
    "LICENSE",
    "pyproject.toml",
    "scripts",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
